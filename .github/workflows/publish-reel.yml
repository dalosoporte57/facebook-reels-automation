name: Publish Facebook Reel

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Optional Reel title"
        required: false
        type: string
      description:
        description: "Optional Reel description/caption"
        required: false
        type: string
  push:
    branches:
      - main

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[RUN_PUBLISH]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install requests

      - name: Check configuration
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
        run: |
          if [ -z "$META_PAGE_ACCESS_TOKEN" ]; then
            echo "::error::META_PAGE_ACCESS_TOKEN no está configurado en GitHub Secrets."
            exit 1
          fi
          echo "META_PAGE_ACCESS_TOKEN está configurado."

      - name: Publish Reel
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          VIDEO_URL: "https://raw.githubusercontent.com/dalosoporte57/facebook-reels-automation/main/video-5_6x03AMPA.mp4"
          REEL_TITLE: ${{ inputs.title }}
          REEL_DESCRIPTION: ${{ inputs.description }}
          META_GRAPH_VERSION: "v26.0"
        run: python publish_reel.py
