name: Publish Facebook Reel

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Direct HTTPS URL of the MP4 video"
        required: true
        type: string
      title:
        description: "Optional Reel title"
        required: false
        type: string
      description:
        description: "Optional Reel description/caption"
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install requests

      - name: Publish Reel
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          VIDEO_URL: ${{ inputs.video_url }}
          REEL_TITLE: ${{ inputs.title }}
          REEL_DESCRIPTION: ${{ inputs.description }}
          META_GRAPH_VERSION: "v26.0"
        run: python publish_reel.py
